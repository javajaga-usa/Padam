name: Android TV APK

on:
  push:
    paths: ["android-tv/**", ".github/workflows/android-tv.yml"]
  pull_request:
    paths: ["android-tv/**", ".github/workflows/android-tv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: padam-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
      - name: Publish to the fixed download link
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk padam.apk
          notes="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/tv-latest/padam.apk"
          if gh release view tv-latest >/dev/null 2>&1; then
            gh release edit tv-latest --notes "$notes"
          else
            gh release create tv-latest --title "Padam for Android TV (latest)" --notes "$notes" --prerelease
          fi
          gh release upload tv-latest padam.apk --clobber
